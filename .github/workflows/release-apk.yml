name: Android Release APK

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-signed-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate signing secrets
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Decode release keystore
        run: |
          umask 077
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signed APK
        run: |
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -f "${apk_path}"
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${apksigner_path}"
          "${apksigner_path}" verify --verbose "${apk_path}"

      - name: Rename APK
        run: |
          apk_name="ScanToInput-${GITHUB_REF_NAME//\//-}.apk"
          mv app/build/outputs/apk/release/app-release.apk "${apk_name}"
          echo "APK_NAME=${apk_name}" >> "${GITHUB_ENV}"

      - name: Upload APK to release
        run: gh release upload "${GITHUB_REF_NAME}" "${APK_NAME}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remove temporary release keystore
        if: always()
        run: rm -f -- "${RUNNER_TEMP}/release.keystore"
