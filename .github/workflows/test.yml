name: Android CI

on:
  push:
    branches:
      - master
      - dev
      - 'develop/**'
  pull_request:
    branches:
      - master
      - dev
      - 'develop/**'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and verify core coverage
        run: ./gradlew test :app:verifyCoreCoverage

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # PR 评论基于 head diff，扫描同一固定 SHA，避免 merge 引入行号偏移。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 不忽略 Lint 的退出码；错误仍使任务失败，后续步骤继续发布已有报告。
      - name: Run Android Lint
        id: lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Verify SARIF report
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        run: |
          test -s app/build/reports/lint-results-debug.sarif
          python3 -m json.tool app/build/reports/lint-results-debug.sarif > /dev/null

      - name: Upload Lint reports
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: error

      # 上传工具从实际 checkout 识别 PR head ref 和 SHA，不手写 merge 提交信息。
      - name: Upload SARIF to GitHub Code Scanning
        if: >-
          ${{ !cancelled() && hashFiles('app/build/reports/lint-results-debug.sarif') != '' &&
              (github.event_name == 'pull_request' || github.actor != 'dependabot[bot]') }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint-debug
          checkout_path: ${{ github.workspace }}
          wait-for-processing: true

      - name: Set up reviewdog
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request' &&
              hashFiles('app/build/reports/lint-results-debug.sarif') != '' }}
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.2

      - name: Report Lint findings on pull request
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request' &&
              hashFiles('app/build/reports/lint-results-debug.sarif') != '' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
          # Fork 和 Dependabot 的只读令牌使用检查注解，不调用 Review 写接口。
          REVIEWDOG_REPORTER: >-
            ${{ github.event.pull_request.head.repo.full_name == github.repository &&
                github.actor != 'dependabot[bot]' &&
                github.event.pull_request.user.login != 'dependabot[bot]' &&
                'github-pr-review' || 'github-pr-annotations' }}
        run: |
          reviewdog -f=sarif -name="Android Lint" \
            -reporter="${REVIEWDOG_REPORTER}" -filter-mode=added -fail-level=none -tee \
            < app/build/reports/lint-results-debug.sarif
